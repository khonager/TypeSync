workflows:
  ios-testflight:
    name: iOS TestFlight Release
    max_build_duration: 120
    instance_type: mac_mini_m1

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: de.khonager.typesync

      groups:
        - app_store_credentials

      vars:
        BUNDLE_ID: "de.khonager.typesync"
        APP_STORE_APP_ID: "6762024261"

      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Validate RevenueCat Apple key
        script: |
          if [ -z "${REVENUECAT_APPLE_API_KEY:-}" ]; then
            echo "REVENUECAT_APPLE_API_KEY is required for TestFlight releases"
            exit 1
          fi
          if [[ "$REVENUECAT_APPLE_API_KEY" == *$'\n'* || "$REVENUECAT_APPLE_API_KEY" == *$'\r'* ]]; then
            echo "REVENUECAT_APPLE_API_KEY must contain only the public Apple key, without a command prefix or line break"
            exit 1
          fi
          case "$REVENUECAT_APPLE_API_KEY" in
            test_*)
              echo "A RevenueCat test key cannot be used in a TestFlight release"
              exit 1
              ;;
          esac

      - name: Flutter build ipa
        script: |
          build_name=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          build_number=$(sed -n 's/^version: .*+\([0-9][0-9]*\).*/\1/p' pubspec.yaml)
          if [ -z "$build_name" ] || [ -z "$build_number" ]; then
            echo "pubspec.yaml must contain a version in the form x.y.z+buildNumber"
            exit 1
          fi

          # Keep each Flutter flag as one shell argument. In particular, do not
          # store a whole `--dart-define=...` command in the Codemagic variable.
          build_args=(
            --release
            --no-tree-shake-icons
            "--build-name=$build_name"
            "--build-number=$build_number"
            "--dart-define=REVENUECAT_APPLE_API_KEY=$REVENUECAT_APPLE_API_KEY"
            --export-options-plist=/Users/builder/export_options.plist
          )
          flutter build ipa "${build_args[@]}"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
        submit_to_app_store: false

  ios-development:
    name: iOS Development Build
    max_build_duration: 120
    instance_type: mac_mini_m1

    environment:
      groups:
        - app_store_credentials

      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Build iOS without signing
        script: |
          flutter build ios --release --no-codesign

    artifacts:
      - build/ios/iphoneos/*.app
