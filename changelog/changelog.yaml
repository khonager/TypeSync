schema_version: 1
releases:
  - version: 1.1.0
    date: 2026-04-08
    title: Kanban + Compatibility
    changes:
      - Added interactive TypeSync Kanban embeds for rich text notes.
      - Notes now track the minimum supported app version for feature compatibility.
      - Older app versions now show an explicit upgrade message for unsupported notes.
      - Editor now restores and autofocuses your previous caret position per file.

  - version: 1.0.0
    date: 2025-01-14
    title: Initial Public Release
    changes:
      - Core TypeSync experience with folders, files, and rich-text editing.
      - Local-first persistence with optional cloud sync and cross-device updates.
      - Attachments, import/export foundations, and productivity modules.
