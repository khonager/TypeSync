# Pull Request Checks
# 
# Runs on every PR to ensure code quality

name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  FLUTTER_VERSION: '3.22.0'

jobs:
  check:
    name: Check PR
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Check formatting
        run: |
          dart format lib test
          if [ -n "$(git status --porcelain lib test)" ]; then
            echo "::error::Code is not properly formatted. Please run 'dart format lib test' and commit the changes."
            git diff lib test
            exit 1
          fi
      
      - name: Analyze code
        run: flutter analyze --fatal-infos
      
      - name: Run tests
        run: flutter test
      
      - name: Check for large files
        run: |
          # Fail if any file is larger than 1MB (except assets)
          find . -type f -size +1M ! -path "./build/*" ! -path "./.git/*" ! -path "./assets/*" | head -1 | grep . && {
            echo "::error::Found files larger than 1MB. Please reduce file sizes."
            exit 1
          } || true

