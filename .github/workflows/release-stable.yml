name: Release Stable

on:
  workflow_run:
    workflows: ["CI/CD"]
    types: [completed]
    branches: [stable]

env:
  FLUTTER_VERSION: "3.27.1"
  JAVA_VERSION: "17"

jobs:
  release-stable:
    name: Release Stable
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'stable'
    runs-on: ubuntu-latest
    env:
      REVENUECAT_ANDROID_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
    permissions:
      contents: write
    concurrency:
      group: release-stable
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Get version from pubspec
        id: version
        run: |
          if ! VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1); then
            echo "::error::Failed to extract version from pubspec.yaml"
            exit 1
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Version is empty"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Determine release strategy
        id: release_strategy
        run: |
          LATEST_TAG=$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)
          LATEST_VERSION=${LATEST_TAG#v}
          if [ -z "$LATEST_VERSION" ]; then
            LATEST_VERSION="0.0.0"
          fi

          CHANGELOG_VERSION=$(python3 -c "import json; print(json.load(open('assets/data/changelog.json', encoding='utf-8'))['latestVersion'])")
          if [ -z "$CHANGELOG_VERSION" ]; then
            echo "::error::Failed to read latestVersion from assets/data/changelog.json"
            exit 1
          fi

          PUBSPEC_VERSION="${{ steps.version.outputs.version }}"
          if [ "$PUBSPEC_VERSION" != "$CHANGELOG_VERSION" ]; then
            echo "::error::pubspec.yaml version ($PUBSPEC_VERSION) must match changelog latestVersion ($CHANGELOG_VERSION) on stable."
            exit 1
          fi

          if [ "$LATEST_VERSION" = "$CHANGELOG_VERSION" ]; then
            MODE="rolling"
            RELEASE_TAG="stable-latest"
            RELEASE_NAME="Latest Stable Build ($CHANGELOG_VERSION)"
            ARTIFACT_PREFIX="TypeSync-stable-latest"
          else
            HIGHEST_VERSION=$(printf '%s\n%s\n' "$LATEST_VERSION" "$CHANGELOG_VERSION" | sort -V | tail -n 1)
            if [ "$HIGHEST_VERSION" != "$CHANGELOG_VERSION" ]; then
              echo "::error::Latest changelog version ($CHANGELOG_VERSION) is older than the latest version tag ($LATEST_VERSION)."
              exit 1
            fi

            if git rev-parse "v$CHANGELOG_VERSION" >/dev/null 2>&1; then
              echo "::error::Tag v$CHANGELOG_VERSION already exists, but it is not the latest version tag."
              exit 1
            fi

            MODE="versioned"
            RELEASE_TAG="v$CHANGELOG_VERSION"
            RELEASE_NAME="TypeSync $CHANGELOG_VERSION"
            ARTIFACT_PREFIX="TypeSync-$CHANGELOG_VERSION"
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "release_version=$CHANGELOG_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "artifact_prefix=$ARTIFACT_PREFIX" >> "$GITHUB_OUTPUT"

      - name: Get commit hash
        id: commit
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Setup Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/upload-keystore.jks

      - name: Setup key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat << EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Validate RevenueCat Android key
        run: |
          if [ -z "$REVENUECAT_ANDROID_API_KEY" ]; then
            echo "::error::REVENUECAT_ANDROID_API_KEY is required for mobile releases"
            exit 1
          fi
          if [[ "$REVENUECAT_ANDROID_API_KEY" == test_* ]]; then
            echo "::error::A RevenueCat test key cannot be used in a mobile release"
            exit 1
          fi

      - name: Build APK (Release)
        run: |
          flutter build apk --release \
            --build-name="$APP_VERSION" \
            --build-number="${{ github.run_number }}" \
            --dart-define=REVENUECAT_ANDROID_API_KEY="$REVENUECAT_ANDROID_API_KEY"

      - name: Build App Bundle (Release)
        run: |
          flutter build appbundle --release \
            --build-name="$APP_VERSION" \
            --build-number="${{ github.run_number }}" \
            --dart-define=REVENUECAT_ANDROID_API_KEY="$REVENUECAT_ANDROID_API_KEY"

      - name: Build Linux
        run: flutter build linux --release

      - name: Create Linux tarball
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../typesync-linux-x64.tar.gz .

      - name: Build Web
        run: flutter build web --release

      - name: Create Web tarball
        run: |
          cd build/web
          tar -czf ../../typesync-web.tar.gz .

      - name: Prepare release files
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/
          cp build/app/outputs/bundle/release/app-release.aab release/
          cp typesync-linux-x64.tar.gz release/
          cp typesync-web.tar.gz release/

          mv release/app-release.apk release/${{ steps.release_strategy.outputs.artifact_prefix }}-android.apk
          mv release/app-release.aab release/${{ steps.release_strategy.outputs.artifact_prefix }}-android.aab
          mv release/typesync-linux-x64.tar.gz release/${{ steps.release_strategy.outputs.artifact_prefix }}-linux-x64.tar.gz
          mv release/typesync-web.tar.gz release/${{ steps.release_strategy.outputs.artifact_prefix }}-web.tar.gz

      - name: Build release body from changelog
        id: release_notes
        run: |
          VERSION="${{ steps.release_strategy.outputs.release_version }}"
          NOTES_FILE="changelog/generated/releases/${VERSION}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "::error::Release notes file not found: $NOTES_FILE"
            echo "::error::Run python3 scripts/generate_changelog.py and add an entry in changelog/changelog.yaml for version ${VERSION}."
            exit 1
          fi

          if [ "${{ steps.release_strategy.outputs.mode }}" = "versioned" ]; then
            {
              echo "body<<EOF"
              cat "$NOTES_FILE"
              echo
              echo "## Downloads"
              echo "- **Android APK**: ${{ steps.release_strategy.outputs.artifact_prefix }}-android.apk"
              echo "- **Android App Bundle**: ${{ steps.release_strategy.outputs.artifact_prefix }}-android.aab"
              echo "- **Linux**: ${{ steps.release_strategy.outputs.artifact_prefix }}-linux-x64.tar.gz"
              echo "- **Web**: ${{ steps.release_strategy.outputs.artifact_prefix }}-web.tar.gz"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "body<<EOF"
            echo "## TypeSync Stable Channel"
            echo
            echo "This rolling release tracks the latest commit on \`stable\` until the next immutable versioned release is created."
            echo
            echo "- Base version: TypeSync ${VERSION}"
            echo "- Build commit: ${{ steps.commit.outputs.short_sha }}"
            echo "- Build date: ${{ github.event.workflow_run.updated_at }}"
            echo
            echo "## Downloads"
            echo "- **Android APK**: ${{ steps.release_strategy.outputs.artifact_prefix }}-android.apk"
            echo "- **Android App Bundle**: ${{ steps.release_strategy.outputs.artifact_prefix }}-android.aab"
            echo "- **Linux**: ${{ steps.release_strategy.outputs.artifact_prefix }}-linux-x64.tar.gz"
            echo "- **Web**: ${{ steps.release_strategy.outputs.artifact_prefix }}-web.tar.gz"
            echo
            echo "## Latest Official Release Notes"
            sed '1d' "$NOTES_FILE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Move stable-latest tag
        if: steps.release_strategy.outputs.mode == 'rolling'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f stable-latest "$GITHUB_SHA"
          git push origin refs/tags/stable-latest --force

      - name: Create versioned release
        if: steps.release_strategy.outputs.mode == 'versioned'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_strategy.outputs.release_tag }}
          name: ${{ steps.release_strategy.outputs.release_name }}
          body: ${{ steps.release_notes.outputs.body }}
          files: |
            release/${{ steps.release_strategy.outputs.artifact_prefix }}-android.apk
            release/${{ steps.release_strategy.outputs.artifact_prefix }}-android.aab
            release/${{ steps.release_strategy.outputs.artifact_prefix }}-linux-x64.tar.gz
            release/${{ steps.release_strategy.outputs.artifact_prefix }}-web.tar.gz
          draft: false
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update stable-latest release
        if: steps.release_strategy.outputs.mode == 'rolling'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_strategy.outputs.release_tag }}
          name: ${{ steps.release_strategy.outputs.release_name }}
          body: ${{ steps.release_notes.outputs.body }}
          files: |
            release/${{ steps.release_strategy.outputs.artifact_prefix }}-android.apk
            release/${{ steps.release_strategy.outputs.artifact_prefix }}-android.aab
            release/${{ steps.release_strategy.outputs.artifact_prefix }}-linux-x64.tar.gz
            release/${{ steps.release_strategy.outputs.artifact_prefix }}-web.tar.gz
          draft: false
          prerelease: false
          make_latest: false
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
