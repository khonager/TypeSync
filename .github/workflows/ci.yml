# TypeSync CI/CD Pipeline
#
# This workflow handles:
# - Code analysis, formatting, and testing on all PRs and pushes
# - Building releases on merge to stable/unstable branches
# - Automatic versioning and tagging

name: CI/CD

on:
  push:
    branches: [main, stable, unstable]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, stable, unstable]

env:
  FLUTTER_VERSION: "3.27.1"
  JAVA_VERSION: "17"

jobs:
  # ============================================
  # ANALYZE AND TEST
  # ============================================
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check code formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze code
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Check for large files
        run: |
          # Fail if any file is larger than 1MB (except assets, git files, build artifacts)
          # We purposefully exclude assets from this check as they might legitimately be large
          find . -type f -size +1M \
            ! -path "./build/*" \
            ! -path "./.git/*" \
            ! -path "./assets/*" \
            ! -path "./release/*" \
            | head -1 | grep . && {
            echo "::error::Found files larger than 1MB. Please reduce file sizes or move to assets."
            exit 1
          } || true

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: coverage/lcov.info
          fail_ci_if_error: false
        continue-on-error: true

  # ============================================
  # BUILD ANDROID - RELEASE
  # ============================================
  build-android-release:
    name: Build Android Release
    runs-on: ubuntu-latest
    needs: analyze
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Get app version
        run: |
          APP_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          if [ -z "$APP_VERSION" ]; then
            echo "::error::Failed to read app version from pubspec.yaml"
            exit 1
          fi
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

      - name: Setup Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/upload-keystore.jks

      - name: Setup key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat << EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build APK (Release)
        run: |
          flutter build apk --release \
            --build-name="$APP_VERSION" \
            --build-number="${{ github.run_number }}"

      - name: Build App Bundle (Release)
        run: |
          flutter build appbundle --release \
            --build-name="$APP_VERSION" \
            --build-number="${{ github.run_number }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-release
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  # ============================================
  # BUILD ANDROID - DEV
  # ============================================
  build-android-dev:
    name: Build Android Dev APK
    runs-on: ubuntu-latest
    needs: analyze
    if: github.event_name == 'push' && github.ref == 'refs/heads/unstable'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Get app version
        run: |
          APP_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          if [ -z "$APP_VERSION" ]; then
            echo "::error::Failed to read app version from pubspec.yaml"
            exit 1
          fi
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

      - name: Setup Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/upload-keystore.jks

      - name: Setup key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat << EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build APK (Dev Release)
        run: |
          flutter build apk --release \
            --build-name="$APP_VERSION-dev.${{ github.run_number }}" \
            --build-number="${{ github.run_number }}" \
            --dart-define=IS_DEV=true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-dev
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  # ============================================
  # BUILD LINUX
  # ============================================
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: analyze
    if: github.event_name == 'push' && (github.ref == 'refs/heads/stable' || github.ref == 'refs/heads/unstable')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Create tarball
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../typesync-linux-x64.tar.gz .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: typesync-linux-x64.tar.gz
          if-no-files-found: error

  # ============================================
  # BUILD WEB
  # ============================================
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: analyze
    if: github.event_name == 'push' && github.ref == 'refs/heads/stable'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

      - name: Create tarball
        run: |
          cd build/web
          tar -czf ../../typesync-web.tar.gz .

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: typesync-web.tar.gz
          if-no-files-found: error

  # ============================================
  # DEPLOY WEB HOSTING - STABLE
  # ============================================
  deploy-web-stable:
    name: Deploy Web (Stable)
    runs-on: ubuntu-latest
    needs: build-web
    if: github.event_name == 'push' && github.ref == 'refs/heads/stable'
    concurrency:
      group: deploy-web-stable
      cancel-in-progress: true
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Web bundle
        uses: actions/download-artifact@v4
        with:
          name: web-bundle
          path: release/
          if-no-files-found: error

      - name: Extract Web bundle
        run: |
          mkdir -p build/web
          tar -xzf release/typesync-web.tar.gz -C build/web

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TYPESYNCED }}
          projectId: typesynced
          channelId: live

  # ============================================
  # DEPLOY WEB HOSTING - UNSTABLE (DEV)
  # ============================================
  deploy-web-unstable:
    name: Deploy Web (Unstable Dev)
    runs-on: ubuntu-latest
    needs: analyze
    if: github.event_name == 'push' && github.ref == 'refs/heads/unstable'
    concurrency:
      group: deploy-web-unstable
      cancel-in-progress: true
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Dev Web
        run: flutter build web --release --dart-define=IS_DEV=true

      - name: Validate Firebase deploy secret
        env:
          FIREBASE_SERVICE_ACCOUNT_TYPESYNCED: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TYPESYNCED }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_TYPESYNCED" ] && [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing Firebase service account secret. Set FIREBASE_SERVICE_ACCOUNT_TYPESYNCED (preferred) or FIREBASE_SERVICE_ACCOUNT."
            exit 1
          fi

      - name: Deploy to Firebase Hosting Dev channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TYPESYNCED || secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: typesynced
          channelId: dev

  # ============================================
  # RELEASE - STABLE BRANCH
  # ============================================
  release-stable:
    name: Release Stable
    runs-on: ubuntu-latest
    needs: [build-android-release, build-linux, build-web]
    if: github.ref == 'refs/heads/stable'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from pubspec
        id: version
        run: |
          if ! VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1); then
            echo "::error::Failed to extract version from pubspec.yaml"
            exit 1
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Version is empty"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Determine next version
        id: semver
        run: |
          # Get the latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 --match "v[0-9]*" 2>/dev/null || echo "v0.0.0")
          LATEST_VERSION=${LATEST_TAG#v}

          # Parse version components
          IFS='.' read -ra VERSION_PARTS <<< "$LATEST_VERSION"
          MAJOR=${VERSION_PARTS[0]:-0}
          MINOR=${VERSION_PARTS[1]:-0}
          PATCH=${VERSION_PARTS[2]:-0}

          # Validate version components are numeric
          if ! [[ "$MAJOR" =~ ^[0-9]+$ ]] || ! [[ "$MINOR" =~ ^[0-9]+$ ]] || ! [[ "$PATCH" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid version format: $LATEST_VERSION"
            exit 1
          fi

          # Increment patch version
          PATCH=$((PATCH + 1))

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Create release directory
        run: mkdir -p release

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk-release
          path: release/
          if-no-files-found: error

      - name: Download Android AAB
        uses: actions/download-artifact@v4
        with:
          name: android-aab-release
          path: release/
          if-no-files-found: error

      - name: Download Linux bundle
        uses: actions/download-artifact@v4
        with:
          name: linux-bundle
          path: release/
          if-no-files-found: error

      - name: Download Web bundle
        uses: actions/download-artifact@v4
        with:
          name: web-bundle
          path: release/
          if-no-files-found: error

      - name: Rename artifacts
        run: |
          if [ ! -f release/app-release.apk ]; then
            echo "::error::Android APK not found"
            exit 1
          fi
          if [ ! -f release/app-release.aab ]; then
            echo "::error::Android AAB not found"
            exit 1
          fi
          if [ ! -f release/typesync-linux-x64.tar.gz ]; then
            echo "::error::Linux bundle not found"
            exit 1
          fi
          if [ ! -f release/typesync-web.tar.gz ]; then
            echo "::error::Web bundle not found"
            exit 1
          fi
          mv release/app-release.apk release/TypeSync-${{ steps.semver.outputs.new_version }}-android.apk
          mv release/app-release.aab release/TypeSync-${{ steps.semver.outputs.new_version }}-android.aab
          mv release/typesync-linux-x64.tar.gz release/TypeSync-${{ steps.semver.outputs.new_version }}-linux-x64.tar.gz
          mv release/typesync-web.tar.gz release/TypeSync-${{ steps.semver.outputs.new_version }}-web.tar.gz

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.semver.outputs.tag }}
          name: TypeSync ${{ steps.semver.outputs.new_version }}
          body: |
            ## TypeSync ${{ steps.semver.outputs.new_version }}

            ### Downloads
            - **Android APK**: TypeSync-${{ steps.semver.outputs.new_version }}-android.apk
            - **Android App Bundle**: TypeSync-${{ steps.semver.outputs.new_version }}-android.aab
            - **Linux**: TypeSync-${{ steps.semver.outputs.new_version }}-linux-x64.tar.gz
            - **Web**: TypeSync-${{ steps.semver.outputs.new_version }}-web.tar.gz

            ### Changes
            See commit history for full changelog.
          files: |
            release/TypeSync-${{ steps.semver.outputs.new_version }}-android.apk
            release/TypeSync-${{ steps.semver.outputs.new_version }}-android.aab
            release/TypeSync-${{ steps.semver.outputs.new_version }}-linux-x64.tar.gz
            release/TypeSync-${{ steps.semver.outputs.new_version }}-web.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # RELEASE - UNSTABLE/DEV BRANCH
  # ============================================
  release-dev:
    name: Release Dev
    runs-on: ubuntu-latest
    needs: [build-android-dev, build-linux]
    if: github.ref == 'refs/heads/unstable'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get commit hash
        id: commit
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Create release directory
        run: mkdir -p release

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk-dev
          path: release/
          if-no-files-found: error

      - name: Download Linux bundle
        uses: actions/download-artifact@v4
        with:
          name: linux-bundle
          path: release/
          if-no-files-found: error

      - name: Rename artifacts
        run: |
          if [ ! -f release/app-release.apk ]; then
            echo "::error::Android APK not found"
            exit 1
          fi
          if [ ! -f release/typesync-linux-x64.tar.gz ]; then
            echo "::error::Linux bundle not found"
            exit 1
          fi
          mv release/app-release.apk release/TypeSync-dev-android.apk
          mv release/typesync-linux-x64.tar.gz release/TypeSync-dev-linux-x64.tar.gz

      - name: Delete old dev release
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          keep_latest: 0
          delete_tag_pattern: dev-latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update dev release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: Latest Dev Build
          body: |
            ## TypeSync Development Build

            ⚠️ **This is an unstable development build. Use at your own risk.**

            Build: ${{ steps.commit.outputs.short_sha }}
            Date: ${{ github.event.head_commit.timestamp }}

            ### Downloads
            - **Android APK**: TypeSync-dev-android.apk
            - **Linux**: TypeSync-dev-linux-x64.tar.gz
          files: |
            release/TypeSync-dev-android.apk
            release/TypeSync-dev-linux-x64.tar.gz
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
