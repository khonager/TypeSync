# TypeSync CI/CD Pipeline
#
# This workflow handles:
# - Code analysis, formatting, and testing on all PRs and pushes
# - Development builds on relevant branches
# - The main CI signal before separate stable release/deploy workflows run

name: CI/CD

on:
  push:
    branches: [main, stable, unstable]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, stable, unstable]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.27.1"
  JAVA_VERSION: "17"

jobs:
  # ============================================
  # ANALYZE AND TEST
  # ============================================
  analyze:
    name: Analyze & Test
    if: github.event_name != 'workflow_dispatch' && (github.event_name != 'push' || github.ref != 'refs/heads/unstable')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify changelog artifacts
        run: python3 scripts/generate_changelog.py --check

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check code formatting
        run: dart format --set-exit-if-changed lib test integration_test

      - name: Analyze code
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Check for large files
        run: |
          # Fail if any file is larger than 1MB (except assets, git files, build artifacts)
          # We purposefully exclude assets from this check as they might legitimately be large
          find . -type f -size +1M \
            ! -path "./build/*" \
            ! -path "./.git/*" \
            ! -path "./assets/*" \
            ! -path "./release/*" \
            | head -1 | grep . && {
            echo "::error::Found files larger than 1MB. Please reduce file sizes or move to assets."
            exit 1
          } || true

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: coverage/lcov.info
          fail_ci_if_error: false
        continue-on-error: true

  # ============================================
  # BUILD ANDROID - RELEASE
  # ============================================
  build-android-release:
    name: Build Android Release
    runs-on: ubuntu-latest
    needs: analyze
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      REVENUECAT_ANDROID_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Get app version
        run: |
          APP_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          if [ -z "$APP_VERSION" ]; then
            echo "::error::Failed to read app version from pubspec.yaml"
            exit 1
          fi
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

      - name: Setup Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/upload-keystore.jks

      - name: Setup key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat << EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Validate RevenueCat Android key
        run: |
          if [ -z "$REVENUECAT_ANDROID_API_KEY" ]; then
            echo "::error::REVENUECAT_ANDROID_API_KEY is required for mobile releases"
            exit 1
          fi
          if [[ "$REVENUECAT_ANDROID_API_KEY" == test_* ]]; then
            echo "::error::A RevenueCat test key cannot be used in a mobile release"
            exit 1
          fi

      - name: Build APK (Release)
        run: |
          flutter build apk --release \
            --build-name="$APP_VERSION" \
            --build-number="${{ github.run_number }}" \
            --dart-define=REVENUECAT_ANDROID_API_KEY="$REVENUECAT_ANDROID_API_KEY"

      - name: Verify packaged Android Firebase Auth SDK
        run: bash scripts/verify_android_firebase_auth_version.sh release

      - name: Build App Bundle (Release)
        run: |
          flutter build appbundle --release \
            --build-name="$APP_VERSION" \
            --build-number="${{ github.run_number }}" \
            --dart-define=REVENUECAT_ANDROID_API_KEY="$REVENUECAT_ANDROID_API_KEY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-release
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  # ============================================
  # BUILD ANDROID - DEV
  # ============================================
  build-android-dev:
    name: Build Android Dev APK
    runs-on: ubuntu-latest
    # Build an artifact for every unstable commit. A rerun keeps the original
    # push event, so it must remain eligible here as well as manual dispatches.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/unstable') || github.event_name == 'workflow_dispatch'
    env:
      REVENUECAT_ANDROID_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Get app version
        run: |
          APP_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          if [ -z "$APP_VERSION" ]; then
            echo "::error::Failed to read app version from pubspec.yaml"
            exit 1
          fi
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

      - name: Setup Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/upload-keystore.jks

      - name: Setup key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat << EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build APK (Dev Release)
        run: |
          flutter build apk --release \
            --build-name="$APP_VERSION-dev.${{ github.run_number }}" \
            --build-number="${{ github.run_number }}" \
            --dart-define=IS_DEV=true \
            --dart-define=REVENUECAT_ANDROID_API_KEY="$REVENUECAT_ANDROID_API_KEY"

      - name: Verify packaged Android Firebase Auth SDK
        run: bash scripts/verify_android_firebase_auth_version.sh release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-dev
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  # ============================================
  # BUILD LINUX
  # ============================================
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Create tarball
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../typesync-linux-x64.tar.gz .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: typesync-linux-x64.tar.gz
          if-no-files-found: error

  # ============================================
  # DEPLOY WEB HOSTING - UNSTABLE (DEV)
  # ============================================
  deploy-web-unstable:
    name: Deploy Web (Unstable Dev)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/unstable'
    concurrency:
      group: deploy-web-unstable
      cancel-in-progress: true
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Dev Web
        run: flutter build web --release --dart-define=IS_DEV=true

      - name: Validate Firebase deploy secret
        env:
          FIREBASE_SERVICE_ACCOUNT_TYPESYNCED: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TYPESYNCED }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_TYPESYNCED" ] && [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing Firebase service account secret. Set FIREBASE_SERVICE_ACCOUNT_TYPESYNCED (preferred) or FIREBASE_SERVICE_ACCOUNT."
            exit 1
          fi

      - name: Deploy to Firebase Hosting Dev channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TYPESYNCED || secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: typesynced
          channelId: dev
