# TypeSync CI/CD Pipeline
#
# This workflow handles:
# - Code analysis, formatting, and testing on all PRs and pushes
# - Building releases on merge to stable/unstable branches
# - Immutable versioned releases plus rolling stable/dev channels

name: CI/CD

on:
  push:
    branches: [main, stable, unstable]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, stable, unstable]

env:
  FLUTTER_VERSION: "3.27.1"
  JAVA_VERSION: "17"

jobs:
  # ============================================
  # ANALYZE AND TEST
  # ============================================
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify changelog artifacts
        run: python3 scripts/generate_changelog.py --check

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check code formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze code
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Check for large files
        run: |
          # Fail if any file is larger than 1MB (except assets, git files, build artifacts)
          # We purposefully exclude assets from this check as they might legitimately be large
          find . -type f -size +1M \
            ! -path "./build/*" \
            ! -path "./.git/*" \
            ! -path "./assets/*" \
            ! -path "./release/*" \
            | head -1 | grep . && {
            echo "::error::Found files larger than 1MB. Please reduce file sizes or move to assets."
            exit 1
          } || true

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: coverage/lcov.info
          fail_ci_if_error: false
        continue-on-error: true

  # ============================================
  # BUILD ANDROID - RELEASE
  # ============================================
  build-android-release:
    name: Build Android Release
    runs-on: ubuntu-latest
    needs: analyze
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Get app version
        run: |
          APP_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          if [ -z "$APP_VERSION" ]; then
            echo "::error::Failed to read app version from pubspec.yaml"
            exit 1
          fi
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

      - name: Setup Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/upload-keystore.jks

      - name: Setup key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat << EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build APK (Release)
        run: |
          flutter build apk --release \
            --build-name="$APP_VERSION" \
            --build-number="${{ github.run_number }}"

      - name: Build App Bundle (Release)
        run: |
          flutter build appbundle --release \
            --build-name="$APP_VERSION" \
            --build-number="${{ github.run_number }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-release
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  # ============================================
  # BUILD ANDROID - DEV
  # ============================================
  build-android-dev:
    name: Build Android Dev APK
    runs-on: ubuntu-latest
    needs: analyze
    if: github.event_name == 'push' && github.ref == 'refs/heads/unstable'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Get app version
        run: |
          APP_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          if [ -z "$APP_VERSION" ]; then
            echo "::error::Failed to read app version from pubspec.yaml"
            exit 1
          fi
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

      - name: Setup Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/upload-keystore.jks

      - name: Setup key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat << EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build APK (Dev Release)
        run: |
          flutter build apk --release \
            --build-name="$APP_VERSION-dev.${{ github.run_number }}" \
            --build-number="${{ github.run_number }}" \
            --dart-define=IS_DEV=true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-dev
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  # ============================================
  # BUILD LINUX
  # ============================================
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: analyze
    if: github.event_name == 'push' && (github.ref == 'refs/heads/stable' || github.ref == 'refs/heads/unstable')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Create tarball
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../typesync-linux-x64.tar.gz .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: typesync-linux-x64.tar.gz
          if-no-files-found: error

  # ============================================
  # BUILD WEB
  # ============================================
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: analyze
    if: github.event_name == 'push' && github.ref == 'refs/heads/stable'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release

      - name: Create tarball
        run: |
          cd build/web
          tar -czf ../../typesync-web.tar.gz .

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: typesync-web.tar.gz
          if-no-files-found: error

  # ============================================
  # DEPLOY WEB HOSTING - STABLE
  # ============================================
  deploy-web-stable:
    name: Deploy Web (Stable)
    runs-on: ubuntu-latest
    needs: build-web
    if: github.event_name == 'push' && github.ref == 'refs/heads/stable'
    concurrency:
      group: deploy-web-stable
      cancel-in-progress: true
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Web bundle
        uses: actions/download-artifact@v4
        with:
          name: web-bundle
          path: release/
          if-no-files-found: error

      - name: Extract Web bundle
        run: |
          mkdir -p build/web
          tar -xzf release/typesync-web.tar.gz -C build/web

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TYPESYNCED }}
          projectId: typesynced
          channelId: live

  # ============================================
  # DEPLOY WEB HOSTING - UNSTABLE (DEV)
  # ============================================
  deploy-web-unstable:
    name: Deploy Web (Unstable Dev)
    runs-on: ubuntu-latest
    needs: analyze
    if: github.event_name == 'push' && github.ref == 'refs/heads/unstable'
    concurrency:
      group: deploy-web-unstable
      cancel-in-progress: true
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Dev Web
        run: flutter build web --release --dart-define=IS_DEV=true

      - name: Validate Firebase deploy secret
        env:
          FIREBASE_SERVICE_ACCOUNT_TYPESYNCED: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TYPESYNCED }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_TYPESYNCED" ] && [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing Firebase service account secret. Set FIREBASE_SERVICE_ACCOUNT_TYPESYNCED (preferred) or FIREBASE_SERVICE_ACCOUNT."
            exit 1
          fi

      - name: Deploy to Firebase Hosting Dev channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TYPESYNCED || secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: typesynced
          channelId: dev

  # ============================================
  # RELEASE - STABLE BRANCH
  # ============================================
  release-stable:
    name: Release Stable
    runs-on: ubuntu-latest
    needs: [build-android-release, build-linux, build-web]
    if: github.ref == 'refs/heads/stable'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from pubspec
        id: version
        run: |
          if ! VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1); then
            echo "::error::Failed to extract version from pubspec.yaml"
            exit 1
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Version is empty"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Determine release strategy
        id: release_strategy
        run: |
          LATEST_TAG=$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)
          LATEST_VERSION=${LATEST_TAG#v}
          if [ -z "$LATEST_VERSION" ]; then
            LATEST_VERSION="0.0.0"
          fi

          CHANGELOG_VERSION=$(python3 -c "import json; print(json.load(open('assets/data/changelog.json', encoding='utf-8'))['latestVersion'])")
          if [ -z "$CHANGELOG_VERSION" ]; then
            echo "::error::Failed to read latestVersion from assets/data/changelog.json"
            exit 1
          fi

          PUBSPEC_VERSION="${{ steps.version.outputs.version }}"
          if [ "$PUBSPEC_VERSION" != "$CHANGELOG_VERSION" ]; then
            echo "::error::pubspec.yaml version ($PUBSPEC_VERSION) must match changelog latestVersion ($CHANGELOG_VERSION) on stable."
            exit 1
          fi

          if [ "$LATEST_VERSION" = "$CHANGELOG_VERSION" ]; then
            MODE="rolling"
            RELEASE_TAG="stable-latest"
            RELEASE_NAME="Latest Stable Build ($CHANGELOG_VERSION)"
            ARTIFACT_PREFIX="TypeSync-stable-latest"
          else
            HIGHEST_VERSION=$(printf '%s\n%s\n' "$LATEST_VERSION" "$CHANGELOG_VERSION" | sort -V | tail -n 1)
            if [ "$HIGHEST_VERSION" != "$CHANGELOG_VERSION" ]; then
              echo "::error::Latest changelog version ($CHANGELOG_VERSION) is older than the latest version tag ($LATEST_VERSION)."
              exit 1
            fi

            if git rev-parse "v$CHANGELOG_VERSION" >/dev/null 2>&1; then
              echo "::error::Tag v$CHANGELOG_VERSION already exists, but it is not the latest version tag."
              exit 1
            fi

            MODE="versioned"
            RELEASE_TAG="v$CHANGELOG_VERSION"
            RELEASE_NAME="TypeSync $CHANGELOG_VERSION"
            ARTIFACT_PREFIX="TypeSync-$CHANGELOG_VERSION"
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "latest_version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_version=$CHANGELOG_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "artifact_prefix=$ARTIFACT_PREFIX" >> "$GITHUB_OUTPUT"

      - name: Get commit hash
        id: commit
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Create release directory
        run: mkdir -p release

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk-release
          path: release/
          if-no-files-found: error

      - name: Download Android AAB
        uses: actions/download-artifact@v4
        with:
          name: android-aab-release
          path: release/
          if-no-files-found: error

      - name: Download Linux bundle
        uses: actions/download-artifact@v4
        with:
          name: linux-bundle
          path: release/
          if-no-files-found: error

      - name: Download Web bundle
        uses: actions/download-artifact@v4
        with:
          name: web-bundle
          path: release/
          if-no-files-found: error

      - name: Rename artifacts
        run: |
          if [ ! -f release/app-release.apk ]; then
            echo "::error::Android APK not found"
            exit 1
          fi
          if [ ! -f release/app-release.aab ]; then
            echo "::error::Android AAB not found"
            exit 1
          fi
          if [ ! -f release/typesync-linux-x64.tar.gz ]; then
            echo "::error::Linux bundle not found"
            exit 1
          fi
          if [ ! -f release/typesync-web.tar.gz ]; then
            echo "::error::Web bundle not found"
            exit 1
          fi
          mv release/app-release.apk release/${{ steps.release_strategy.outputs.artifact_prefix }}-android.apk
          mv release/app-release.aab release/${{ steps.release_strategy.outputs.artifact_prefix }}-android.aab
          mv release/typesync-linux-x64.tar.gz release/${{ steps.release_strategy.outputs.artifact_prefix }}-linux-x64.tar.gz
          mv release/typesync-web.tar.gz release/${{ steps.release_strategy.outputs.artifact_prefix }}-web.tar.gz

      - name: Build release body from changelog
        id: release_notes
        run: |
          VERSION="${{ steps.release_strategy.outputs.release_version }}"
          NOTES_FILE="changelog/generated/releases/${VERSION}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "::error::Release notes file not found: $NOTES_FILE"
            echo "::error::Run python3 scripts/generate_changelog.py and add an entry in changelog/changelog.yaml for version ${VERSION}."
            exit 1
          fi

          if [ "${{ steps.release_strategy.outputs.mode }}" = "versioned" ]; then
            {
              echo "body<<EOF"
              cat "$NOTES_FILE"
              echo
              echo "## Downloads"
              echo "- **Android APK**: ${{ steps.release_strategy.outputs.artifact_prefix }}-android.apk"
              echo "- **Android App Bundle**: ${{ steps.release_strategy.outputs.artifact_prefix }}-android.aab"
              echo "- **Linux**: ${{ steps.release_strategy.outputs.artifact_prefix }}-linux-x64.tar.gz"
              echo "- **Web**: ${{ steps.release_strategy.outputs.artifact_prefix }}-web.tar.gz"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "body<<EOF"
            echo "## TypeSync Stable Channel"
            echo
            echo "This rolling release tracks the latest commit on \`stable\` until the next immutable versioned release is created."
            echo
            echo "- Base version: TypeSync ${VERSION}"
            echo "- Build commit: ${{ steps.commit.outputs.short_sha }}"
            echo "- Build date: ${{ github.event.head_commit.timestamp }}"
            echo
            echo "## Downloads"
            echo "- **Android APK**: ${{ steps.release_strategy.outputs.artifact_prefix }}-android.apk"
            echo "- **Android App Bundle**: ${{ steps.release_strategy.outputs.artifact_prefix }}-android.aab"
            echo "- **Linux**: ${{ steps.release_strategy.outputs.artifact_prefix }}-linux-x64.tar.gz"
            echo "- **Web**: ${{ steps.release_strategy.outputs.artifact_prefix }}-web.tar.gz"
            echo
            echo "## Latest Official Release Notes"
            sed '1d' "$NOTES_FILE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Move stable-latest tag
        if: steps.release_strategy.outputs.mode == 'rolling'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f stable-latest "$GITHUB_SHA"
          git push origin refs/tags/stable-latest --force

      - name: Create versioned release
        if: steps.release_strategy.outputs.mode == 'versioned'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_strategy.outputs.release_tag }}
          name: ${{ steps.release_strategy.outputs.release_name }}
          body: ${{ steps.release_notes.outputs.body }}
          files: |
            release/${{ steps.release_strategy.outputs.artifact_prefix }}-android.apk
            release/${{ steps.release_strategy.outputs.artifact_prefix }}-android.aab
            release/${{ steps.release_strategy.outputs.artifact_prefix }}-linux-x64.tar.gz
            release/${{ steps.release_strategy.outputs.artifact_prefix }}-web.tar.gz
          draft: false
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update stable-latest release
        if: steps.release_strategy.outputs.mode == 'rolling'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_strategy.outputs.release_tag }}
          name: ${{ steps.release_strategy.outputs.release_name }}
          body: ${{ steps.release_notes.outputs.body }}
          files: |
            release/${{ steps.release_strategy.outputs.artifact_prefix }}-android.apk
            release/${{ steps.release_strategy.outputs.artifact_prefix }}-android.aab
            release/${{ steps.release_strategy.outputs.artifact_prefix }}-linux-x64.tar.gz
            release/${{ steps.release_strategy.outputs.artifact_prefix }}-web.tar.gz
          draft: false
          prerelease: false
          make_latest: false
          target_commitish: ${{ github.sha }}
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # RELEASE - UNSTABLE/DEV BRANCH
  # ============================================
  release-dev:
    name: Release Dev
    runs-on: ubuntu-latest
    needs: [build-android-dev, build-linux]
    if: github.ref == 'refs/heads/unstable'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get commit hash
        id: commit
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Create release directory
        run: mkdir -p release

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk-dev
          path: release/
          if-no-files-found: error

      - name: Download Linux bundle
        uses: actions/download-artifact@v4
        with:
          name: linux-bundle
          path: release/
          if-no-files-found: error

      - name: Rename artifacts
        run: |
          if [ ! -f release/app-release.apk ]; then
            echo "::error::Android APK not found"
            exit 1
          fi
          if [ ! -f release/typesync-linux-x64.tar.gz ]; then
            echo "::error::Linux bundle not found"
            exit 1
          fi
          mv release/app-release.apk release/TypeSync-dev-android.apk
          mv release/typesync-linux-x64.tar.gz release/TypeSync-dev-linux-x64.tar.gz

      - name: Delete old dev release
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          keep_latest: 0
          delete_tag_pattern: dev-latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update dev release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: Latest Dev Build
          body: |
            ## TypeSync Development Build

            ⚠️ **This is an unstable development build. Use at your own risk.**

            Build: ${{ steps.commit.outputs.short_sha }}
            Date: ${{ github.event.head_commit.timestamp }}

            ### Downloads
            - **Android APK**: TypeSync-dev-android.apk
            - **Linux**: TypeSync-dev-linux-x64.tar.gz
          files: |
            release/TypeSync-dev-android.apk
            release/TypeSync-dev-linux-x64.tar.gz
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
