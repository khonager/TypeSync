name: Release Unstable

on:
  workflow_run:
    workflows: ["CI/CD"]
    types: [completed]
    branches: [unstable]

env:
  FLUTTER_VERSION: "3.27.1"
  JAVA_VERSION: "17"

jobs:
  release-unstable:
    name: Release Unstable
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'unstable'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-unstable
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Get app version
        id: version
        run: |
          APP_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          if [ -z "$APP_VERSION" ]; then
            echo "::error::Failed to read app version from pubspec.yaml"
            exit 1
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "release_tag=v$APP_VERSION-dev.${{ github.event.workflow_run.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Get commit hash
        id: commit
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/upload-keystore.jks

      - name: Setup key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat << EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build APK (Dev Release)
        run: |
          flutter build apk --release \
            --build-name="$APP_VERSION-dev.${{ github.event.workflow_run.run_number }}" \
            --build-number="${{ github.event.workflow_run.run_number }}" \
            --dart-define=IS_DEV=true

      - name: Build Linux
        run: flutter build linux --release

      - name: Create Linux tarball
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../typesync-linux-x64.tar.gz .

      - name: Prepare release files
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/TypeSync-dev-android.apk
          cp typesync-linux-x64.tar.gz release/TypeSync-dev-linux-x64.tar.gz

      - name: Publish versioned dev release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: TypeSync ${{ env.APP_VERSION }} Dev Build (${{ github.event.workflow_run.run_number }})
          body: |
            ## TypeSync Development Build

            ⚠️ **This is an unstable development build. Use at your own risk.**

            Version: ${{ env.APP_VERSION }}-dev.${{ github.event.workflow_run.run_number }}
            Build: ${{ steps.commit.outputs.short_sha }}
            Date: ${{ github.event.workflow_run.updated_at }}

            ### Downloads
            - **Android APK**: TypeSync-dev-android.apk
            - **Linux**: TypeSync-dev-linux-x64.tar.gz
          files: |
            release/TypeSync-dev-android.apk
            release/TypeSync-dev-linux-x64.tar.gz
          draft: false
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
