plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id 'com.google.gms.google-services'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "de.khonager.typesync"
    compileSdk 36
    ndkVersion "28.2.13676358"

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? rootProject.file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "de.khonager.typesync"
        // RevenueCat UI requires Android API 24+.
        minSdkVersion 24
        targetSdk flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        
        // Enable multidex for Firebase
        multiDexEnabled true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt', 'META-INF/ASL2.0']
        }
    }

    buildTypes {
        release {
            // Updated to use release signing config!
            signingConfig signingConfigs.release
            
            // Enable code shrinking and obfuscation
            minifyEnabled true
            shrinkResources false  // Temporarily disabled to fix AAPT2 issue
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
}

android.applicationVariants.all { variant ->
    def capitalizedVariant = variant.name.capitalize()
    def versionReport = rootProject.file(
        "../build/app/outputs/firebase-auth-version/${variant.name}.txt"
    )

    def verifyFirebaseAuthTask = tasks.register(
        "verify${capitalizedVariant}FirebaseAuthVersion"
    ) {
        outputs.file(versionReport)
        outputs.upToDateWhen { false }

        doLast {
            def runtimeClasspath = configurations.getByName(
                "${variant.name}RuntimeClasspath"
            )
            def authComponents = runtimeClasspath.incoming.resolutionResult
                .allComponents
                .findAll { component ->
                    component.moduleVersion?.group == 'com.google.firebase' &&
                        component.moduleVersion?.name == 'firebase-auth'
                }
            def resolvedVersions = authComponents
                .collect { it.moduleVersion.version }
                .unique()

            if (resolvedVersions.size() != 1) {
                throw new GradleException(
                    "Expected one resolved firebase-auth dependency, found " +
                    "${resolvedVersions ?: 'none'}."
                )
            }

            def resolvedVersion = resolvedVersions.first()
            versionReport.parentFile.mkdirs()
            versionReport.text = "$resolvedVersion\n"

            if (resolvedVersion != rootProject.ext.firebase_auth_version) {
                throw new GradleException(
                    "Expected firebase-auth ${rootProject.ext.firebase_auth_version}, " +
                    "but Gradle resolved $resolvedVersion."
                )
            }

            logger.lifecycle(
                "Verified ${variant.name} uses firebase-auth $resolvedVersion."
            )
        }
    }

    variant.preBuildProvider.configure {
        dependsOn verifyFirebaseAuthTask
    }
}
