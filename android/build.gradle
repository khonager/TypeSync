buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    configurations.configureEach {
        resolutionStrategy {
            // home_widget 0.8.1 uses dynamic AndroidX versions. Keep CI from
            // resolving newer releases that require a newer compileSdk/AGP
            // than Flutter 3.27.1 currently supports.
            force 'androidx.glance:glance-appwidget:1.1.1'
            force 'androidx.work:work-runtime-ktx:2.9.1'
            force 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}


