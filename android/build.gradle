buildscript {
    ext.firebase_auth_version = '24.2.0'
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    configurations.configureEach {
        resolutionStrategy {
            // home_widget 0.8.1 uses dynamic AndroidX versions. Keep CI from
            // resolving newer releases that require a newer compileSdk/AGP
            // than Flutter 3.27.1 currently supports.
            force 'androidx.glance:glance-appwidget:1.1.1'
            force 'androidx.work:work-runtime-ktx:2.9.1'
            force 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
            // firebase_core 3.15.2 resolves Firebase Auth 23.2.1. That native
            // release has a confirmed cold-start regression which signs out
            // users whose encrypted Auth data was restored by Android backup.
            // Pin the current fixed release until FlutterFire ships a BoM
            // containing Firebase Auth 24.0.1 or newer.
            force "com.google.firebase:firebase-auth:$firebase_auth_version"
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
