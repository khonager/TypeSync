name: typesync
description: A cross-platform note-taking app with cloud sync, markdown support, and productivity features.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1
  
  # Firebase Integration
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  
  # File Handling
  file_picker: ^6.1.1
  pdf_render: ^1.4.12
  syncfusion_flutter_pdfviewer: ^24.1.41
  printing: ^5.12.0
  pdf: ^3.10.8
  
  # Markdown & Text Editing
  flutter_quill: ^9.3.4
  markdown: ^7.2.2
  flutter_markdown: ^0.6.22
  
  # UI Components
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  flutter_colorpicker: ^1.0.3
  animated_text_kit: ^4.2.2
  shimmer: ^3.0.0
  
  # Date & Time
  table_calendar: ^3.0.9
  intl: ^0.19.0
  
  # Connectivity & Sync
  connectivity_plus: ^5.0.2
  
  # Utilities
  uuid: ^4.3.3
  collection: ^1.18.0
  equatable: ^2.0.5
  rxdart: ^0.27.7
  
  # Platform Specific
  window_manager: ^0.3.8
  desktop_window: ^0.4.0
  home_widget: ^0.4.1
  
  # Icons
  cupertino_icons: ^1.0.6
  material_design_icons_flutter: ^7.0.7296

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  mockito: ^5.4.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  
  assets:
    - assets/icons/
    - assets/images/
    - assets/fonts/
  
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
