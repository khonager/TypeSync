name: typesync
description: A cross-platform note-taking app with cloud sync, markdown support, and productivity features.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1
  
  # Firebase Integration
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.3
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  
  # File Handling
  file_picker: ^8.0.0
  syncfusion_flutter_pdfviewer: ^28.1.37
  printing: ^5.13.0
  pdf: ^3.11.0
  desktop_drop: ^0.7.0
  cross_file: ^0.3.4
  
  # Markdown & Text Editing
  flutter_quill: ^11.5.0
  markdown: ^7.2.2
  flutter_markdown: ^0.7.3
  
  # UI Components
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  flutter_colorpicker: ^1.0.3
  animated_text_kit: ^4.2.2
  shimmer: ^3.0.0
  
  # Date & Time
  table_calendar: ^3.1.2
  intl: any
  
  # Connectivity & Sync
  connectivity_plus: ^6.0.5
  
  # Utilities
  uuid: ^4.3.3
  collection: ^1.18.0
  equatable: ^2.0.5
  rxdart: ^0.27.7
  path: ^1.9.0
  
  # Platform Specific
  window_manager: ^0.4.2
  
  # Icons
  cupertino_icons: ^1.0.6
  material_design_icons_flutter: ^7.0.7296

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  mockito: ^5.4.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  
  # Assets will be added as needed
  # assets:
  #   - assets/icons/
  #   - assets/images/
  
  # Using Google Fonts instead of bundled fonts
