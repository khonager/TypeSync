# TypeSync Analysis Options
# Enforces code quality and consistency across the project

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  errors:
    # Treat these as warnings instead of errors for flexibility
    invalid_annotation_target: ignore
    # Downgrade these to info/warning to allow CI to pass
    # These are intentional design choices, not bugs
    avoid_slow_async_io: info
    use_build_context_synchronously: info
    deprecated_member_use: info
    inference_failure_on_function_invocation: warning
    inference_failure_on_instance_creation: warning
  language:
    strict-casts: true
    # Disabled: causes too many false positives with Flutter's generic APIs
    # like showDialog, showModalBottomSheet, etc.
    strict-inference: false
    strict-raw-types: true

linter:
  rules:
    # Style rules
    - always_declare_return_types
    - always_put_required_named_parameters_first
    - avoid_empty_else
    - avoid_print
    - avoid_relative_lib_imports
    # Disabled: async I/O is intentional design choice for file operations
    # - avoid_slow_async_io
    - avoid_type_to_string
    - avoid_unnecessary_containers
    - avoid_unused_constructor_parameters
    - avoid_void_async
    - await_only_futures
    - cancel_subscriptions
    - close_sinks
    - comment_references
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_child_properties_last
    - unnecessary_await_in_return
    - unnecessary_brace_in_string_interps
    # Disabled: we check mounted explicitly when needed
    # - use_build_context_synchronously
    - use_key_in_widget_constructors
